name: Terraform Static Analysis

on:
  workflow_dispatch:

  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  terraform-format-validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TF_LOG: "ERROR"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Set Env
      - name: Set Environment
        run: |
          case "${{ github.base_ref }}" in
            dev)
              echo "ENV=dev" >> $GITHUB_ENV
              ;;
            staging)
              echo "ENV=staging" >> $GITHUB_ENV
              ;;
            main)
              echo "ENV=production" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid Target Branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

      - name: List Module Folders
        run: ls -l Modules/

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

        # TF Version
      - name: Terraform Version
        working-directory: environments/${ENV}
        run: terraform version

        # Format
      - name: Terraform FMT
        working-directory: environments/${ENV}
        run: terraform fmt -check -recursive

        # Initialize Terraform Without Backend
      - name: Initialize Terraform
        working-directory: environments/${ENV}
        run: terraform init -backend=false -var-file=${ENV}.tfvars

        # Validation
      - name: Terraform Validate
        working-directory: environments/${ENV}
        run: terraform validate

  tflint:
    name: TFLint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: terraform-format-validate

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Set Env
      - name: Set Environment
        run: |
          case "${{ github.base_ref }}" in
            dev)
              echo "ENV=dev" >> $GITHUB_ENV
              ;;
            staging)
              echo "ENV=staging" >> $GITHUB_ENV
              ;;
            main)
              echo "ENV=production" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid Target Branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

        # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

        # Initialize Terraform Without Backend
      - name: Terraform Init
        working-directory: environments/${ENV}
        run: terraform init -backend=false -var-file=${ENV}.tfvars

        # Setup TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

        # Azure TFLint config
      - name: Configure Azure TFLint Rules
        run: |
          cat <<EOF > .tflint.hcl
          config {
            format = "compact"
          }

          plugin "azurerm" {
            enabled = true
            source  = "github.com/terraform-linters/tflint-ruleset-azurerm"
            version = "0.27.0"
          }

          rule "terraform_unused_declarations" {
            enabled = true
            level   = "WARNING"
          }
          EOF

        # TF Init
      - name: Initialize TFLint
        working-directory: environments/${ENV}
        run: tflint --init -var-file=${ENV}.tfvars
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Run RFLint
      - name: Run TFLint
        working-directory: environments/${ENV}
        run: tflint --recursive -f compact || true

  checkov-security-analysis:
    if: github.event_name == 'pull_request'
    name: Checkov Security Analysis
    runs-on: ubuntu-latest
    needs: tflint

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Set Env
      - name: Set Environment
        run: |
          case "${{ github.base_ref }}" in
            dev)
              echo "ENV=dev" >> $GITHUB_ENV
              ;;
            staging)
              echo "ENV=staging" >> $GITHUB_ENV
              ;;
            main)
              echo "ENV=production" >> $GITHUB_ENV
              ;;
            *)
              echo "Invalid target branch: ${{ github.base_ref }}"
              exit 1
              ;;
          esac

      #  Run Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: environments/${ENV}
          framework: terraform
          check: CKV_AZURE_*
          soft_fail: false
          output_format: cli
          download_external_modules: true

          # HTTP (160) - Storage Account Replication(206) - Storage Queue Logging (33) - Storage Blob Restrict Public Access (190) - Storage accounts disallow public access(59) -VMSS have encryption at host enabled (97)
          skip_check: CKV_AZURE_160,CKV_AZURE_206,CKV_AZURE_33,CKV_AZURE_190,CKV_AZURE_59,CKV_AZURE_97
